<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductor - NovaRuta</title>

  <link rel="stylesheet" href="../css/inicio_conductor.css">
</head>

<body>

    <div class="pantalla">

        <!-- Decoración superior -->
        <div class="decoracion-superior"></div>

        <!-- Logo -->
        <img src="logo.png" alt="NovaRuta Manizales" class="logo">

        <!-- Contenido -->
        <main class="contenido">

            <h1>Conductor</h1>

            <center>
            <form class="formulario">

                <div class="campo">
                    <label for="cedula">Cedula</label>
                    <input 
                        type="text" 
                        id="cedula" 
                        placeholder="C.C."
                    >
                </div>

                <div class="campo">
                    <label for="placa">Placa del Vehiculo</label>
                    <input 
                        type="text" 
                        id="placa" 
                        placeholder="..."
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="..."
                    >
                </div>

                <button type="submit">Continuar</button>

            </form>
            </center>
        </main>

        <!-- Bus -->
        <div class="bus">

            <div class="bus-parabrisas"></div>

            <div class="bus-ventana-izq"></div>
            <div class="bus-ventana-der"></div>

            <div class="bus-cuerpo">

                <div class="bus-ventana"></div>

                <div class="bus-faro faro-izq"></div>
                <div class="bus-faro faro-der"></div>

            </div>

            <div class="bus-rueda rueda-izq"></div>
            <div class="bus-rueda rueda-der"></div>

        </div>

        <!-- Parte inferior -->
        <footer class="inferior">

            <div class="circulo-naranja circulo-1"></div>
            <div class="circulo-naranja circulo-2"></div>

            <!-- Flecha -->
            <div class="flecha">
                <span></span>
                <span></span>
            </div>

        </footer>

    </div>

</body>
</html>
