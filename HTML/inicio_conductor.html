<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Conductor</title>

    <link rel="stylesheet" href="../css/inicio_conductor.css">
</head>

<body>

    <header>

        <div class="logo">

            <span><img src="../img/Shape Set.png" alt=""></span>


        </div>

    </header>


    <main>

        <section class="formulario">

            <h1>Conductor</h1>


            <div class="campo">

                <label for="cedula">
                    Cédula
                </label>

                <input type="text" id="Cedula" name="cedula" placeholder="C.C." autocomplete="username">

            </div>


            <div class="campo">

                <label for="placa">
                    Placa del Vehículo
                </label>

                <input type="text" id="placa" name="placa" placeholder="..." autocomplete="off">

            </div>


            <div class="campo">

                <label for="Password">
                    Contraseña
                </label>

                <input type="password" id="password" name="password" placeholder="..." autocomplete="current-password">

            </div>


            <button type="button" id="btnguardar">Continuar</button>



        </section>


        <div class="bus">

            <img src="../img/transporte-publico.png" alt="Transporte público">

        </div>

    </main>


    <footer>

        <div class="decoracion"></div>

        <div class="decoracion derecha"></div>

        <!-- Botón volver -->
        <button type="button" class="volver" aria-label="Volver" id="btnguardar"
            onclick="window.location.href='comoinciar.html'">

        </button>

    </footer>





    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/inicio_conductor.js"></script>

</body>

</html>
