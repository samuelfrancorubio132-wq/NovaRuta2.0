<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Conductor</title>

    <link rel="stylesheet" href="../css/inicio_conductor.css">
</head>

<body>

    <!-- =========================================
         ENCABEZADO
    ========================================== -->
    <header>

        <div class="logo">

            <span><img src="../img/Shape Set.png" alt=""></span>


        </div>

    </header>


    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================== -->
    <main>

        <!-- FORMULARIO -->
        <section class="formulario">

            <h1>Conductor</h1>


            <!-- CÉDULA -->
            <div class="campo">

                <label for="cedula">
                    Cédula
                </label>

                <input
                    type="text"
                    id="cedula"
                    name="cedula"
                    placeholder="C.C."
                    autocomplete="username"
                >

            </div>


            <!-- PLACA -->
            <div class="campo">

                <label for="placa">
                    Placa del Vehículo
                </label>

                <input
                    type="text"
                    id="placa"
                    name="placa"
                    placeholder="..."
                    autocomplete="off"
                >

            </div>


            <!-- CONTRASEÑA -->
            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="..."
                    autocomplete="current-password"
                >

            </div>


            <!-- BOTÓN -->
            <button type="button" id="btnContinuar" onclick="window.location.href='rutas_asignadas.html'">
                Continuar
            </button>

        </section>


        <!-- =========================================
             ICONO DEL BUS
        ========================================== -->
        <div class="bus">

            <img
                src="../img/transporte-publico.png"
                alt="Transporte público"
            >

        </div>

    </main>


    <!-- =========================================
         PIE DE PÁGINA
    ========================================== -->
    <footer>

        <div class="decoracion"></div>

        <div class="decoracion derecha"></div>

        <!-- Botón volver -->
        <button
            
            type="button"
            class="volver"
            aria-label="Volver"
            id="btnVolver"
            onclick="window.location.href='comoinciar.html'">
        
        </button>

    </footer>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/inicio_conductor.js"></script>

</body>

</html>
