<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Conductor</title>

    <link rel="stylesheet" href="../css/inicio_conductor.css">
</head>

<body>

    <!-- Encabezado -->
    <header>

        <div class="logo">

            <span>
                <img src="../img/Shape Set.png" alt="Logo NovaRuta">
            </span>


        </div>

    </header>


    <!-- Contenido principal -->
    <main>

        <!-- Formulario -->
        <section class="formulario">

            <h1>Reportar novedad</h1>

            <div class="campo">

                <label for="cedula">Cédula</label>

                <input
                    type="text"
                    id="cedula"
                    name="cedula"
                    placeholder="C.C."
                >

            </div>


            <div class="campo">

                <label for="placa">Placa del Vehículo</label>

                <input
                    type="text"
                    id="placa"
                    name="placa"
                    placeholder="..."
                >

            </div>


            <div class="campo">

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="..."
                >

            </div>


            <button type="button" onclick="window.location.href='novedades.html'">
                Continuar
            </button>

        </section>


        <!-- Imagen del bus -->
        <div class="bus">

            <img
                src="../img/transporte-publico.png"
                alt="Transporte público"
            >

        </div>

    </main>


    <!-- Pie de página -->
    <footer>

        <div class="decoracion"></div>

        <div class="decoracion derecha"></div>

    </footer>

<script src="../js/reportar_novedad.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</body>

</html>
