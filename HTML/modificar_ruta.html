<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar ruta</title>
    <link rel="stylesheet" href="../css/modificar_ruta.css">
</head>

<body>

    <div class="pagina">

        <!-- ENCABEZADO -->
        <header class="header">

            <div class="logo">
                <img src="../img/Shape Set.png" alt="Logo">
            </div>

        </header>

        <!-- TÍTULO -->
        <h1>Modificar ruta</h1>

        <!-- LISTA DE RUTAS -->
        <section class="rutas">

            <div class="ruta">
                <div class="ruta-info">
                    <b>RUTA 01</b>
                    <span>MANIZALES - CALDAS</span>
                    <span>PARQUE PRINCIPAL</span>
                </div>

                <button class="config">⚙</button>
                <button class="editar">✎</button>
            </div>


            <div class="ruta">
                <div class="ruta-info">
                    <b>RUTA 02</b>
                    <span>MANIZALES - CALDAS</span>
                    <span>TERMINAL - CENTRO</span>
                </div>

                <button class="config">⚙</button>
                <button class="editar">✎</button>
            </div>


            <div class="ruta">
                <div class="ruta-info">
                    <b>RUTA 03</b>
                    <span>MANIZALES - CALDAS</span>
                    <span>LA ENEA - CENTRO</span>
                </div>

                <button class="config">⚙</button>
                <button class="editar">✎</button>
            </div>


            <div class="ruta">
                <div class="ruta-info">
                    <b>RUTA 04</b>
                    <span>MANIZALES - CALDAS</span>
                    <span>LA LINDA - CENTRO</span>
                </div>

                <button class="config">⚙</button>
                <button class="editar">✎</button>
            </div>

        </section>


        <!-- ICONO GRANDE DE EDITAR -->
        <div class="icono-editar">

            <div class="cuadro"></div>

            <div class="lapiz"></div>

        </div>


        <!-- PARTE INFERIOR -->
        <footer>

            <div class="flecha">←</div>

            <div class="forma-naranja naranja1"></div>
            <div class="forma-naranja naranja2"></div>

        </footer>

    </div>
    
<script src="/JS/modificar_ruta.js"></script>
</body>

</html>
