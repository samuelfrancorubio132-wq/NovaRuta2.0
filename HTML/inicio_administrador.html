

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Administrador</title>

    <link rel="stylesheet" href="..//css/inicio_administrador.css">

</head>

<body>
    <!-- ENCABEZADO -->
    <header>

        <div class="logo">

            <img src="../img/Shape Set.png" alt="Logo NovaRuta">


        </div>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <section class="formulario">

            <h1>Administrador</h1>


            <!-- CORREO -->
            <div class="campo">

                <label for="correo">
                    Correo de administrador
                </label>

                <input type="email" id="correo" name="correo" placeholder="C.C.">

            </div>


            <!-- CONTRASEÑA -->
            <div class="campo">

                <label for="contrasena">
                    Contraseña
                </label>

                <input type="password" id="contrasena" name="contrasena" placeholder="...">

            </div>


            <!-- LLAVE -->
            <div class="campo">

                <label for="password">
                    Llave de acceso
                </label>

                <input type="password" id="password" name="password" placeholder="...">

            </div>


            <!-- BOTÓN -->
            <button type="button" onclick="window.location.href='bienvenido_administrador.html'">
                Continuar
            </button>

        </section>


        <!-- IMAGEN DEL ADMINISTRADOR -->
        <div class="bus">

            <img src="../img/gerente.png" alt="Administrador">

        </div>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>

        <div class="decoracion"></div>

        <div class="decoracion derecha"></div>


    </footer>
   
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <script src="../JS/inicio_administrador.js"></script> 
 
</body> 
 
</html>
