<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Administrador</title>

    <link rel="stylesheet" href="..//css/inicio_administrador.css">

</head>

<body>
    <header>

        <div class="logo">

            <img src="../img/Shape Set.png" alt="Logo NovaRuta">


        </div>

    </header>


    <main>

        <section class="formulario">

            <h1>Administrador</h1>


            <div class="campo">

                <label for="correo">
                    Correo
                </label>

                <input type="email" id="correo" name="correo" placeholder="C.C.">

            </div>


            <div class="campo">

                <label for="contrasena">
                    Contraseña
                </label>

                <input type="password" id="contrasena" name="contrasena" placeholder="...">

            </div>


            <div class="campo">

                <label for="password">
                    Llave de acceso
                </label>

                <input type="password" id="password" name="password" placeholder="...">

            </div>


            <button type="button" id="btnguardar">
                Continuar
            </button>

        </section>


        <div class="bus">

            <img src="../img/gerente.png" alt="Administrador">

        </div>

    </main>


    <footer>

        <div class="decoracion"></div>

        <div class="decoracion derecha"></div>

        <button class="volver" title="Volver" onclick="window.location.href='comoinciar.html'">

            <span></span>

        </button>



    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JS/inicio_administrador.js"></script>

</body>

</html>
