
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Administrador</title>

    <link rel="stylesheet" href="../css/inicio_conductor.css">

</head>

<body>

    <!-- Encabezado -->
    <header>

        <div class="logo">

            <span>
                <img src="../img/Shape Set.png" alt="Logo NovaRuta">
            </span>

            <div>
                <strong>NovaRuta</strong>
                <br>
                Manizales
            </div>

        </div>

    </header>


    <!-- Contenido principal -->
    <main>

        <section class="formulario">

            <h1>Administrador</h1>


            <!-- Correo -->
            <div class="campo">

                <label for="correo">
                    Correo de administrador
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="Correo electrónico"
                >

            </div>


            <!-- Contraseña -->
            <div class="campo">

                <label for="contrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    placeholder="Contraseña"
                >

            </div>


            <!-- Llave de acceso -->
            <div class="campo">

                <label for="llave">
                    Llave de acceso
                </label>

                <input
                    type="password"
                    id="llave"
                    placeholder="Llave de acceso"
                >

            </div>


            <button type="button">
                Continuar
            </button>

        </section>


        <!-- Icono del administrador -->
        <div class="bus">

            <img
                src="../img/gerente.png"
                alt="Administrador"
            >

        </div>

    </main>


    <!-- Pie de página -->
    <footer>

        <div class="decoracion"></div>

        <div class="decoracion derecha"></div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JS/inicio_administrador.js"></script>

</body>

</html>
