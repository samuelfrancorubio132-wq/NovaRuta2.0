<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Novedades</title>

    <link
        rel="stylesheet"
        href="../css/Novedades.css"
    >
</head>

<body>

    <div class="pagina">

        <!-- =========================================
             ENCABEZADO
        ========================================== -->

        <header class="header">

            <div class="logo">

                <img
                    src="../img/Shape Set.png"
                    alt="NovaRuta"
                >

            </div>

        </header>


        <!-- =========================================
             CONTENIDO PRINCIPAL
        ========================================== -->

        <main class="contenido1">

            <h1 class="titulo">
                Novedades
            </h1>


            <!-- NOVEDAD 1 -->

            <button
                type="button"
                class="boton boton-1"
                aria-label="Ver novedad 1"
            >
                <span class="puntos">•••</span>
            </button>


            <!-- NOVEDAD 2 -->

            <button
                type="button"
                class="boton boton-2"
                aria-label="Ver novedad 2"
            >
                <span class="puntos">•••</span>
            </button>


            <!-- NOVEDAD 3 -->

            <button
                type="button"
                class="boton boton-3"
                aria-label="Ver novedad 3"
            >
                <span class="puntos">•••</span>
            </button>


            <!-- NOVEDAD 4 -->

            <button
                type="button"
                class="boton boton-4"
                aria-label="Ver novedad 4"
            >
                <span class="puntos">•••</span>
            </button>

        </main>


        <!-- =========================================
             PIE DE PÁGINA
        ========================================== -->

        <footer class="footer">

            <div
                class="circulo-naranja-1"
                aria-hidden="true"
            ></div>

            <div
                class="circulo-naranja-2"
                aria-hidden="true"
            ></div>


            <button
                type="button"
                class="volver"
                aria-label="Volver atrás"
                onclick="history.back()"
            >
            </button>

        </footer>

    </div>

</body>

</html>
