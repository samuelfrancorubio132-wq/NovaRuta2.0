<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta</title>

    <link rel="stylesheet" href="../css/comoiniciar.css">
</head>

<body>

    <main class="app">

        <!-- BARRA SUPERIOR -->
        <header class="top-bar">

            <div class="logo-circle">
                <img src="logo.png" alt="Logo NovaRuta">
            </div>

        </header>


        <!-- CONTENIDO -->
        <section class="content">

            <h1>
                ¿Como vas a iniciar<br>
                sesión?
            </h1>

            <div class="buttons">

                <button type="button">
                    Conductor
                </button>

                <button type="button">
                    Administrador
                </button>

            </div>

        </section>


        <!-- BARRA INFERIOR -->
        <footer class="bottom-bar">

            <button class="back" aria-label="Volver">
                ←
            </button>

            <div class="bubble bubble-1"></div>

            <div class="bubble bubble-2"></div>

        </footer>

    </main>

</body>

</html>
