<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rutas de Socobuses</title>

    <link
        rel="stylesheet"
        href="../css/style inicio.css"
    >
</head>

<body>

    <!-- =========================================
         ENCABEZADO
    ========================================== -->

    <header class="header">

        <div class="logo">
            <img
                src="../img/Shape Set.png"
                alt="Logo de NovaRuta"
            >

            <div class="logo-text">
                <strong>NovaRuta</strong>
            </div>
        </div>


        <a
            class="login-btn"
            href="comoinciar.html"
        >
            Iniciar Sesión
        </a>

    </header>


    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <main class="main-content">

        <!-- =====================================
             COLUMNA IZQUIERDA
        ====================================== -->

        <section class="left-column">

            <!-- TÍTULO -->

            <div class="title-section">

                <h1>RUTAS DE SOCOBUSES</h1>

                <svg
                    viewBox="0 0 24 24"
                    class="location-icon"
                    aria-hidden="true"
                >
                    <path
                        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zM12 11.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"
                    />
                </svg>

            </div>


            <!-- BUSCADOR + LEYENDA -->

            <div class="search-legend">

                <div class="search-bar">

                    <input
                        type="search"
                        id="searchRoute"
                        placeholder="¿Dónde estás?..."
                        aria-label="Buscar ruta"
                    >

                    <svg
                        viewBox="0 0 24 24"
                        class="search-icon"
                        aria-hidden="true"
                    >
                        <path
                            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM10 14a4 4 0 110-8 4 4 0 010 8z"
                        />
                    </svg>

                </div>


                <div class="status-legend">

                    <span class="legend-item">
                        <span class="legend-dot legend-active"></span>
                        ACTIVO
                    </span>

                    <span class="legend-item">
                        <span class="legend-dot legend-delay"></span>
                        RETRASO
                    </span>

                </div>

            </div>


            <!-- =================================
                 LISTA DE RUTAS
            ================================== -->

            <div class="route-list">

                <div class="route-card">
                    <span>
                        Ruta 510 ARANJUEZ - BANCA DEL FERROCARRIL - LIBORIO
                    </span>

                    <span
                        class="route-status route-active"
                        aria-label="Ruta activa"
                    ></span>
                </div>


                <div class="route-card">
                    <span>
                        Ruta 513 LAS COLINAS - MORROGACHO
                    </span>

                    <span
                        class="route-status route-delay"
                        aria-label="Ruta con retraso"
                    ></span>
                </div>


                <div class="route-card">
                    <span>
                        Ruta 510 LIBORIO - CENTRO
                    </span>

                    <span
                        class="route-status route-active"
                        aria-label="Ruta activa"
                    ></span>
                </div>


                <div class="route-card">
                    <span>
                        Ruta 515 LA PRADERA - PANAMERICANA - LIBORIO
                    </span>

                    <span
                        class="route-status route-active"
                        aria-label="Ruta activa"
                    ></span>
                </div>


                <div class="route-card">
                    <span>
                        Ruta 522 LAS COLINAS - FATIMA - ZONA INDUSTRIAL
                    </span>

                    <span
                        class="route-status route-delay"
                        aria-label="Ruta con retraso"
                    ></span>
                </div>

            </div>

        </section>


        <!-- =====================================
             MAPA
        ====================================== -->

        <section class="map-area">

            <iframe
                src="../mapa/Mapa.html"
                class="map-frame"
                title="Mapa interactivo de Socobuses"
                allow="geolocation"
            ></iframe>

        </section>

    </main>


    <!-- =========================================
         DECORACIÓN INFERIOR
    ========================================== -->

    <div
        class="bottom-shape"
        aria-hidden="true"
    ></div>


    <!-- =========================================
         BOTÓN VOLVER
    ========================================== -->

    <button
        type="button"
        class="back-button"
        aria-label="Volver atrás"
        onclick="history.back()"
    >

        <svg
            class="back-arrow"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path
                d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
            />
        </svg>

    </button>

</body>

</html>
