<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bienvenido</title>

    <link rel="stylesheet" href="../css/bienvenido_administrador.css">
</head>

<body>

    <div class="pagina">

        <!-- =========================
             ENCABEZADO
        ========================== -->
        <header class="header">

            <!-- LOGO -->
            <div class="logo">
                <img src="../img/Shape Set.png" alt="Logo">
            </div>

            <!-- TÍTULO -->
            <h1>Bienvenido</h1>

            <!-- BOTÓN CERRAR SESIÓN -->
            <button class="cerrar-sesion">
                Cerrar Sesión
            </button>

        </header>


        <!-- =========================
             BARRA DE OPCIONES
        ========================== -->
        <section class="barra-opciones">

            <div class="opciones">

                <!-- CREAR -->
                <div class="opcion">
                    <span class="icono">🛠️</span>

                    <button>
                        Crear
                    </button>
                </div>


                <!-- ASIGNAR RUTA -->
                <div class="opcion">
                    <span class="icono">👤</span>

                    <button>
                        Asignar ruta
                    </button>
                </div>


                <!-- MODIFICAR RUTA -->
                <div class="opcion">
                    <span class="icono">🛠️</span>

                    <button>
                        Modificar ruta
                    </button>
                </div>


                <!-- ACTIVIDAD -->
                <div class="opcion">
                    <span class="icono">👥</span>

                    <button>
                        Actividad
                    </button>
                </div>

            </div>


            <!-- AVATAR -->
            <div class="avatar">
                <img src="../img/gerente.png" alt="Usuario">
            </div>

        </section>


        <!-- =========================
             ESPACIO PRINCIPAL
        ========================== -->
        <main class="contenido">

        </main>


        <!-- =========================
             PARTE INFERIOR
        ========================== -->
        <footer class="footer">

            <div class="texto-footer">
                Bienvenido
            </div>

            <div class="circulo circulo-1"></div>

            <div class="circulo circulo-2"></div>

        </footer>

    </div>

</body>
</html>
