<div class="pagina">

    <!-- ENCABEZADO -->
    <header class="header">

        <div class="logo">
            <img src="../img/Shape Set.png" alt="Logo NovaRuta">
        </div>

        <h1>Bienvenido</h1>

        <button class="cerrar-sesion" type="button"
            onclick="window.location.href='empresa_transporte.html'">
            Cerrar Sesión
        </button>

    </header>


    <!-- BARRA DE OPCIONES -->
    <section class="barra-opciones">

        <div class="opciones">

            <!-- CREAR -->
            <div class="opcion">
                <span class="icono">🛠️</span>

                <button type="button"
                    onclick="window.location.href='crear_ruta.html'">
                    Crear
                </button>
            </div>


            <!-- ASIGNAR RUTA -->
            <div class="opcion">
                <span class="icono">👤</span>

                <button type="button"
                    onclick="window.location.href='rutas_asignadas.html'">
                    Asignar ruta
                </button>
            </div>


            <!-- MODIFICAR RUTA -->
            <div class="opcion">
                <span class="icono">🛠️</span>

                <button type="button"
                    onclick="window.location.href='modificar_ruta.html'">
                    Modificar ruta
                </button>
            </div>


            <!-- ACTIVIDAD -->
            <div class="opcion">
                <span class="icono">👥</span>

                <button type="button"
                    onclick="window.location.href='conductores_disponibles.html'">
                    Actividad
                </button>
            </div>

        </div>


        <!-- AVATAR -->
        

    </section>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido">
        <img src="../img/gerente.png" alt="NovaRuta Manizales">
    </main>


    <!-- PARTE INFERIOR -->
    <footer class="footer">

        <div class="texto-footer">
            Bienvenido
        </div>

        <div class="circulo circulo-1"></div>

        <div class="circulo circulo-2"></div>

    </footer>

</div>
