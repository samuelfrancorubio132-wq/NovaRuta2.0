<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Administrador</title>

    <link rel="stylesheet" href="../css/Administrador_Rutas.css">
</head>

<body>

    <div class="pagina">


        <header class="encabezado">

            <div class="zona-logo">
                <img src="../img/Shape Set.png" alt="NovaRuta Manizales">
            </div>

            <h1>Bienvenido</h1>

            <button class="btn-cerrar" type="button">
                Cerrar Sesión
            </button>

        </header>



        <main class="contenido">

            <h2>Rutas asignadas</h2>

            <section class="rutas">

                <!-- RUTA 1 -->
                <div class="fila-ruta">

                    <div class="hora">
                        8:00 AM - 10:00 AM
                    </div>

                    <div class="tarjeta">
                        <strong>Ruta 510</strong>

                        <span>
                            ARANJUEZ - BANCA DEL<br>
                            FERROCARRIL - LIBORIO
                        </span>
                    </div>

                    <div class="estado aceptada">
                        <span>✓</span>
                    </div>

                </div>


                <div class="fila-ruta">

                    <div class="hora">
                        12:00 PM - 2:00 PM
                    </div>

                    <div class="tarjeta">
                        <strong>Ruta 515</strong>

                        <span>
                            LA PRADERA - PANAMERICANA -<br>
                            LIBORIO
                        </span>
                    </div>

                    <div class="estado pendiente">
                        <span class="reloj"></span>
                    </div>

                </div>


           
                <div class="fila-ruta">

                    <div class="hora">
                        4:00 PM - 6:00 PM
                    </div>

                    <div class="tarjeta">
                        <strong>Ruta 522</strong>

                        <span>
                            LAS COLINAS - FATIMA - ZONA<br>
                            INDUSTRIAL
                        </span>
                    </div>

                    <div class="estado rechazada">
                        <span>×</span>
                    </div>

                </div>

            </section>



            <div class="mapa-icono">

                <svg viewBox="0 0 170 170" xmlns="http://www.w3.org/2000/svg">

                    <path d="M22 66 L57 82 L57 143 L22 126 Z" fill="none" stroke="#000" stroke-width="9"
                        stroke-linejoin="round" />

                    <path d="M57 82 L98 61 L98 123 L57 143 Z" fill="none" stroke="#000" stroke-width="9"
                        stroke-linejoin="round" />

                    <path d="M98 61 L132 78 L132 137 L98 123 Z" fill="none" stroke="#000" stroke-width="9"
                        stroke-linejoin="round" />

                    <path d="M132 78 L168 64 L168 123 L132 137 Z" fill="none" stroke="#000" stroke-width="9"
                        stroke-linejoin="round" />


                    <!-- Pin -->

                    <path
                        d="M94 17
                        C76 17 62 31 62 49
                        C62 74 94 105 94 105
                        C94 105 126 74 126 49
                        C126 31 112 17 94 17 Z" fill="#000" />

                    <circle cx="94" cy="48" r="12" fill="#fff" />

                </svg>

            </div>

        </main>


        <!-- =========================
             PIE
        ========================== -->
        <footer class="pie">

            <div class="volver">

                <span class="flecha">
                    ←
                </span>

                <span>
                    Administrador
                </span>

            </div>

            <div class="circulo circulo-1"></div>

            <div class="circulo circulo-2"></div>

        </footer>

    </div>

</body>

</html>
