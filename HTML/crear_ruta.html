<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Crear ruta</title>

    <!-- Conexión con el CSS -->
    <link rel="stylesheet" href="/css/Crear_ruta.css">

</head>


<body>


    <!-- =================================
         ENCABEZADO
    ================================== -->

    <header>

        <div class="logo">

            <img
                src="/img/Shape Set.png"
                alt="Logo NovaRuta"
            >

        </div>

    </header>



    <!-- =================================
         CONTENIDO PRINCIPAL
    ================================== -->

    <main>


        <!-- =================================
             FORMULARIO
        ================================== -->

        <form class="formulario">


            <!-- TÍTULO -->

            <h1>Crear ruta</h1>



            <!-- =================================
                 NÚMERO DE LA RUTA
            ================================== -->

            <div class="campo">

                <label for="numero">
                    Número de la ruta
                </label>

                <input
                    type="text"
                    id="numero"
                    name="numero"
                    placeholder="..."
                >

            </div>



            <!-- =================================
                 PARADEROS
            ================================== -->

            <div class="campo">

                <label for="paraderos">
                    Paraderos
                </label>

                <input
                    type="text"
                    id="paraderos"
                    name="paraderos"
                    placeholder="..."
                >

            </div>



            <!-- =================================
                 DESTINO INICIAL
            ================================== -->

            <div class="campo">

                <label for="destinoInicial">
                    Destino inicial
                </label>

                <input
                    type="text"
                    id="destinoInicial"
                    name="destinoInicial"
                    placeholder="..."
                >

            </div>



            <!-- =================================
                 DESTINO FINAL
            ================================== -->

            <div class="campo">

                <label for="destinoFinal">
                    Destino final
                </label>

                <input
                    type="text"
                    id="destinoFinal"
                    name="destinoFinal"
                    placeholder="..."
                >

            </div>



            <!-- =================================
                 BOTÓN CONTINUAR
            ================================== -->

            <button type="submit">
                Continuar
            </button>


        </form>



        <!-- =================================
             IMAGEN DEL BUS
        ================================== -->

        <div class="bus">

            <img
                src="/img/transporte-publico.png"
                alt="Bus"
            >

        </div>


    </main>



    <!-- =================================
         PIE DE PÁGINA
    ================================== -->

    <footer>


        <!-- CÍRCULO NARANJA IZQUIERDO -->

        <div class="decoracion"></div>


        <!-- CÍRCULO NARANJA DERECHO -->

        <div class="decoracion derecha"></div>


        <button
            class="volver"
            type="button"
            aria-label="Volver">
        </button>


    </footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JS/crear_ruta.js"></script>
</body>

</html>
