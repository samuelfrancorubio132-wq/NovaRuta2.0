<!DOCTYPE html>

<html lang="es">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Crear ruta</title>

    <link rel="stylesheet" href="../css/Crear_ruta.css">

</head>

<body>



    <header>

        <div class="logo">

            <img src="../img/Shape Set.png" alt="Logo NovaRuta">

        </div>

    </header>




    <main>



        <form class="formulario">


            <h1>Crear ruta</h1>



            <div class="campo">

                <label for="numero">
                    Número de la ruta
                </label>

                <input type="text" id="numero" name="numero" placeholder="...">

            </div>



            <div class="campo">

                <label for="paraderos">
                    Paraderos
                </label>

                <input type="text" id="paraderos" name="paraderos" placeholder="...">

            </div>



            <div class="campo">

                <label for="destinoInicial">
                    Destino inicial
                </label>

                <input type="text" id="destinoInicial" name="destinoInicial" placeholder="...">

            </div>



            <div class="campo">

                <label for="destinoFinal">
                    Destino final
                </label>

                <input type="text" id="destinoFinal" name="destinoFinal" placeholder="...">

            </div>



            <button type="submit">
                Continuar
            </button>


        </form>




        <div class="bus">

            <img src="../img/transporte-publico.png" alt="Bus">

        </div>


    </main>




    <footer>

        <div class="decoracion"></div>

        <div class="decoracion derecha"></div>

        <button class="volver" type="button" aria-label="Volver"
            onclick="window.location.href='bienvenido_administrador.html'"></button>


        </button>

    </footer>




    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../JS/crear_ruta.js"></script>


</body>

</html>
