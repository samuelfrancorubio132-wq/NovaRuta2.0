<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaRuta - Conductor</title>

    <link rel="stylesheet" href="../css/ruta_asignada.css">

</head>

<body>

    <div class="pagina">

        <!-- HEADER -->
        <header class="header">

            <div class="circulo-logo"></div>

            <div class="logo">
                <img
                    src="../img/Shape Set.png"
                    alt="Logo NovaRuta"
                >
            </div>

            <h1>
                Bienvenido
            </h1>

            <button class="cerrar" type="button" onclick="window.location.href='empresa_transporte.html'">
                Cerrar Sesion
            </button>

        </header>


        <!-- CONTENIDO -->
        <main class="contenido">

            <!-- PANEL DE RUTAS -->
            <section class="panel-rutas">

                <h2>
                    Rutas asignadas
                </h2>


                <!-- RUTA 510 -->
                <div class="ruta">

                    <div class="hora">
                        8:00 AM - 10:00 AM
                    </div>

                    <div class="datos">

                        <span class="nombre-ruta">
                            Ruta 510
                        </span>

                        <span class="recorrido">
                            ARENAZUL - BANCA DEL<br>
                            FERROCARRIL - LIBORIO
                        </span>

                    </div>

                    <button class="btn aceptar" type="button">
                        ✓
                    </button>

                    <button class="btn esperar" type="button">
                        <span></span>
                    </button>

                    <button class="btn cancelar" type="button">
                        ×
                    </button>

                </div>


                <!-- RUTA 515 -->
                <div class="ruta">

                    <div class="hora">
                        12:00 PM - 2:00 PM
                    </div>

                    <div class="datos">

                        <span class="nombre-ruta">
                            Ruta 515
                        </span>

                        <span class="recorrido">
                            LA PRADERA - PANAMERICANA -<br>
                            LIBORIO
                        </span>

                    </div>

                    <button class="btn aceptar" type="button">
                        ✓
                    </button>

                    <button class="btn esperar" type="button">
                        <span></span>
                    </button>

                    <button class="btn cancelar" type="button">
                        ×
                    </button>

                </div>


                <!-- RUTA 522 -->
                <div class="ruta">

                    <div class="hora">
                        4:00 PM - 6:00 PM
                    </div>

                    <div class="datos">

                        <span class="nombre-ruta">
                            Ruta 522
                        </span>

                        <span class="recorrido">
                            LAS COLINAS - FATIMA - ZONA<br>
                            INDUSTRIAL
                        </span>

                    </div>

                    <button class="btn aceptar" type="button">
                        ✓
                    </button>

                    <button class="btn esperar" type="button">
                        <span></span>
                    </button>

                    <button class="btn cancelar" type="button">
                        ×
                    </button>

                </div>

            </section>


            <!-- PANEL DERECHO -->
            <section class="panel-derecho">

                <div class="novedad">

                    <div class="alarma">
                        🔊
                    </div>

                    <div class="titulo-novedad">
                        Reportar Novedad
                    </div>

                    <textarea placeholder="..."></textarea>

                    <button class="enviar" type="button">
                        Enviar
                    </button>

                </div>

            </section>

        </main>


        <!-- FOOTER -->
        <footer class="footer">

            <h2>
                Conductor
            </h2>

            <div class="naranja-izquierda"></div>

            <div class="naranja-derecha"></div>

        </footer>

<script src="../js/rutas_asignadas.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </div>

</body>

</html>
