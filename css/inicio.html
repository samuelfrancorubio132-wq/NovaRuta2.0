<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rutas de Socobuses</title>
<link rel="stylesheet" href="/novaruta/css/style inicio.css" />
</head>
<body>
<header>
  <div class="logo">
    <img src="C:\Users\Brayam C\Downloads\Logo.png" alt="Logo Nova Ruta Manizales" width="300">
    <div><strong>NovaRuta</strong></div>
  </div>
  <button class="login-btn">Iniciar Sesión</button>
</header>
<main>
  <div class="left-column">
    <div class="title-section">
      RUTAS DE SOCOBUSES
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zM12 11.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>
    </div>
    <div class="search-legend">
      <div class="search-bar">
        <input type="text" placeholder="¿Dónde estás?..." />
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM10 14a4 4 0 110-8 4 4 0 010 8z"/></svg>
      </div>
      <div class="status-legend">
        <span><span class="legend-dot legend-active"></span>ACTIVO</span>
        <span><span class="legend-dot legend-delay"></span>RETRASO</span>
      </div>
    </div>
    <div class="route-list">
      <div class="route-card">
        Ruta 510 ARANJUEZ - BANCA DEL FERROCARRIL - LIBORIO
        <span class="route-status route-active"></span>
      </div>
      <div class="route-card">
        Ruta 513 LAS COLINAS - MORROGACHO
        <span class="route-status route-delay"></span>
      </div>
      <div class="route-card">
        Ruta 510 LIBORIO - CENTRO
        <span class="route-status route-active"></span>
      </div>
      <div class="route-card">
        Ruta 515 LA PRADERA - PANAMERICANA - LIBORIO
        <span class="route-status route-active"></span>
      </div>
      <div class="route-card">
        Ruta 522 LAS COLINAS - FATIMA - ZONA INDUSTRIAL
        <span class="route-status route-delay"></span>
      </div>
    </div>
  </div>
  <div class="map-area">
    <div class="map-placeholder" aria-label="Mapa de rutas de Socobuses"></div>
  </div>
</main>
<div class="bottom-shape"></div>
<svg class="back-arrow" viewBox="0 0 24 24" aria-label="Volver atrás">
  <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
</svg>
</body>
</html>
